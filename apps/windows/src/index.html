<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>coTs</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar" data-tauri-drag-region>
    <button class="icon" id="back" data-label="back" hidden><span aria-hidden="true">‹</span></button>
    <h1 data-tauri-drag-region>coTs <span id="unread" class="count" hidden></span></h1>
    <div class="spacer" data-tauri-drag-region></div>
    <button class="icon" id="new" data-label="newNote"><svg aria-hidden="true" viewBox="0 0 16 16"><path d="M8 2v12M2 8h12"/></svg></button>
    <button class="icon" id="open-settings" data-label="settings"><svg aria-hidden="true" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg></button>
    <button class="icon" id="close" data-label="hide"><svg aria-hidden="true" viewBox="0 0 16 16"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button>
  </header>

  <section id="list-view">
    <div class="tools">
      <input id="search" type="search" autocomplete="off">
      <nav id="folders" class="chips folders"></nav>
      <nav id="filters" class="chips filters">
        <button data-filter="unread" aria-pressed="false"></button>
        <button data-filter="pending" aria-pressed="false"></button>
        <button data-filter="archived" aria-pressed="false"></button>
      </nav>
    </div>
    <ul id="notes" class="notes"></ul>
    <div id="empty" class="empty" hidden>
      <p id="empty-text"></p>
      <button id="retry" hidden></button>
    </div>
  </section>

  <section id="detail-view" hidden>
    <article id="detail"></article>
  </section>

  <section id="new-view" hidden>
    <form id="new-form" class="form">
      <label><span data-text="folder"></span> <select id="new-folder"></select></label>
      <label><span data-text="title"></span> <input id="new-title" required></label>
      <label class="grow"><span data-text="body"></span> <textarea id="new-body"></textarea></label>
      <div class="row end">
        <button type="button" id="new-cancel" data-text="cancel"></button>
        <button type="submit" class="primary" data-text="create"></button>
      </div>
    </form>
  </section>

  <section id="settings-view" hidden>
    <div id="settings" class="form"></div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toast-text"></span>
    <button class="icon" id="toast-close" data-label="close"><svg aria-hidden="true" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
  </div>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
